services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boxscheduler
      POSTGRES_USER: boxscheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxscheduler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxscheduler -d boxscheduler"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://boxscheduler:${POSTGRES_PASSWORD:-boxscheduler}@db:5432/boxscheduler?sslmode=disable
      PORT: "8080"
      # claude-cli (subscription token) | anthropic-api (API key) | fake | none
      AI_PROVIDER: ${AI_PROVIDER:-claude-cli}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_TIDY_MODEL: ${AI_TIDY_MODEL:-claude-haiku-5-5}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Accounts: set COOKIE_SECURE=true behind HTTPS; PUBLIC_URL is used in the owner setup link.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-3080}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Google sign-in (Google Cloud Console → OAuth client, redirect URI = PUBLIC_URL/api/auth/google/callback)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-}
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-}
      SIGNUP_LIMIT_PER_IP: ${SIGNUP_LIMIT_PER_IP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3080}:80"

volumes:
  pgdata:
