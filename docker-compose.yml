services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boxscheduler
      POSTGRES_USER: boxscheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boxscheduler}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxscheduler -d boxscheduler"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off step before the servers start: schema changes and the two login roles.
  migrate:
    build: { context: ./server, target: admin }
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgres://boxscheduler:${POSTGRES_PASSWORD:-boxscheduler}@db:5432/boxscheduler?sslmode=disable
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-app-service-local}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-app-admin-local}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- the app (scales on its own) ----
  api:
    build: { context: ./server, target: service }
    environment:
      DATABASE_URL: postgres://app_service:${SERVICE_DB_PASSWORD:-app-service-local}@db:5432/boxscheduler?sslmode=disable
      PORT: "8080"
      # claude-cli (subscription token) | anthropic-api (API key) | fake | none
      AI_PROVIDER: ${AI_PROVIDER:-claude-cli}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_TIDY_MODEL: ${AI_TIDY_MODEL:-claude-haiku-5-5}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Accounts' own AI: AI_SECRET_KEY seals their API keys (64 hex chars); AI_ALLOW_PRIVATE lists
      # internal hosts/CIDRs their local LLM may be on (e.g. "192.168.0.0/16,mac-mini.local").
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}
      AI_ALLOW_PRIVATE: ${AI_ALLOW_PRIVATE:-}
      AI_ANTHROPIC_BASE_URL: ${AI_ANTHROPIC_BASE_URL:-}
      # Accounts: set COOKIE_SECURE=true behind HTTPS; PUBLIC_URL is used in the owner setup link.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-3080}}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Google sign-in (Google Cloud Console → OAuth client, redirect URI = PUBLIC_URL/api/auth/google/callback)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-}
      # Team invite emails over SMTP through a mail provider (e.g. Resend: smtp.resend.com, 587).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Notifications: Web Push keys are made on first start (needs AI_SECRET_KEY to seal them).
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:noreply@box-scheduler.com}
      PUSH_ALLOW_HOSTS: ${PUSH_ALLOW_HOSTS:-}
      REMINDER_EVERY: ${REMINDER_EVERY:-30s}
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-}
      SIGNUP_LIMIT_PER_IP: ${SIGNUP_LIMIT_PER_IP:-}
      # Meeting recordings, uploaded piece by piece while a meeting is recorded.
      MEETING_AUDIO_DIR: /data/meetings
    volumes:
      - meeting-audio:/data/meetings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3080}:80"

  # ---- the admin console (its own processes, ports and database role) ----
  admin-api:
    build: { context: ./server, target: admin }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://app_admin:${ADMIN_DB_PASSWORD:-app-admin-local}@db:5432/boxscheduler?sslmode=disable
      PORT: "8090"
      ADMIN_DB_MAX_CONNS: ${ADMIN_DB_MAX_CONNS:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SERVICE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-3080}}
      ADMIN_LOGIN_LIMIT_PER_IP: ${ADMIN_LOGIN_LIMIT_PER_IP:-}
      # Seals the service AI's key; the app server opens it with the same value.
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8090}:8090"

  admin-web:
    build: { context: ., dockerfile: admin-web/Dockerfile }
    depends_on:
      - admin-api
    # Not published beyond this machine until it sits behind a VPN or IP allowlist.
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-3090}:80"

volumes:
  pgdata:
  meeting-audio:
