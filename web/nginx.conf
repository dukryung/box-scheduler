server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;
    # AI calls on a local model can take minutes; the default 60s would cut them off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Meeting recordings arrive in pieces of a few hundred KB.
    client_max_body_size 5m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The service worker must always be fresh so updates reach browsers.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: unknown paths serve index.html so client-side routes work.
  location / {
    try_files $uri /index.html;
  }
}
